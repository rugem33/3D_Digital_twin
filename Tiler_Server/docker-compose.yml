services:
  tiler-server:
    build: .
    container_name: tiler-server
    ports:
      - "8000:8000"
    environment:
      PUBLIC_BASE_URL: "http://localhost:8000"
      DEFAULT_COORDINATE_CODE: "5186"
      DEFAULT_HEIGHT_COLUMN: "height"
      DEFAULT_SKIRT_HEIGHT: "10.0"
      CONVERT_TIMEOUT_SECONDS: "1800"
      MAX_UPLOAD_MB: "512"
    volumes:
      - ./data:/data
    restart: unless-stopped
